# Bayt Al Mosawer — customer installation (production)
# Usage:  docker compose up -d
# Then open http://<server>:3000 and complete the setup wizard.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attendance']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: baytalmosawer/attendance-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://attendance:${DB_PASSWORD:-change-me}@db:5432/attendance
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Bayt Al Mosawer}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/uploads

  web:
    image: baytalmosawer/attendance-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - '3001:3001'

volumes:
  pgdata:
  uploads:
